name: Refresh data
on:
  schedule:
    - cron: '43 5 * * *'   # daily, 05:43 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Accept a large per-region change that the guard would otherwise block'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pull Riot's sheet and rebuild data.js and history.js
        env:
          ALLOW_BIG_CHANGE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/refresh.js
      - name: Commit if anything changed
        run: |
          git config user.name "contract-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js history.js
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Daily data refresh $(date -u +%F)"; git push; fi
